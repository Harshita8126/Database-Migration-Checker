version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: migration-checker-pg
    environment:
      POSTGRES_DB: migration_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migration_test"]
      interval: 5s
      timeout: 5s
      retries: 5
